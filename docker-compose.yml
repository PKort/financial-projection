services:
  db:
    image: mariadb:latest
    container_name: projection_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    image: projection-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projection_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - PORT=3000
      - NODE_ENV=development
    ports:
      - "3020:3000"
      - "5555:5555"
    depends_on:
      - db

  frontend:
    image: projection-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projection_frontend
    restart: unless-stopped
    ports:
      - "82:80" # Mapowanie: PORT_HOSTA:PORT_KONTENERA

  dev-proxy:
    image: nginx:alpine
    container_name: projection_dev_proxy
    restart: unless-stopped
    ports:
      - "8080:80"  # DEV wejście: http://localhost:8080
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mariadb_data: